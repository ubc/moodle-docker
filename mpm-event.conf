# Apache mpm_event tuning for Moodle. With PHP offloaded to php-fpm, an
# Apache worker thread is only occupied while a request is actively being
# read/proxied/written — not while PHP runs. We can therefore run far more
# Apache workers than under prefork+mod_php without exhausting memory.
#
# Real concurrency cap is set by fpm's pm.max_children (currently 30).
# Anything above that queues at fpm's listen.backlog. MaxRequestWorkers here
# is sized to absorb burst keep-alive idle connections behind the ingress.

<IfModule mpm_event_module>
    StartServers              2
    MinSpareThreads          25
    MaxSpareThreads          75
    ThreadsPerChild          25
    ServerLimit               8
    MaxRequestWorkers       200
    MaxConnectionsPerChild 10000
</IfModule>
