name: CI to Docker Hub

# Controls when the workflow will run
on:
  # Triggers the workflow on pushes to any branch or tag. PRs are covered by the
  # branch push build, so there is no separate pull_request trigger.
  push:
    branches: [ "*" ]
    tags: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel an in-progress build when a newer commit is pushed to the same branch or tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set tag
        id: tag
        run: |
          REF="${GITHUB_REF#refs/*/}"
          echo "tag=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ./
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: lthub/moodle:${{ steps.tag.outputs.tag }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
