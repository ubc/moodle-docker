; Moodle php-fpm pool override. Loaded after the default www.conf because of
; the leading "zz-" prefix in the destination filename.
;
; Sizing target: pod with 2 Gi memory and ~512 MB PHP memory_limit. With
; pm.max_children=30 and an observed steady-state working set of 40-60 MB per
; worker (Moodle 4.5, OPcache shared between workers), peak RSS sits around
; 1.2-1.6 Gi. pm.max_requests recycles workers periodically to bound
; memory creep from Moodle's many third-party plugins.
;
; Apache event MPM in front allows MaxRequestWorkers ~ 200, which absorbs
; concurrency bursts at the HTTP layer even when only 30 are actively
; executing PHP — the rest queue at fpm's listen.backlog.

[www]
; Listen on loopback TCP. Unix socket would be marginally faster but TCP
; avoids socket permission and lifecycle issues when both daemons start
; from the same entrypoint.
listen = 127.0.0.1:9000
listen.backlog = 256

user  = www-data
group = www-data

pm                   = dynamic
pm.max_children      = 30
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 1000

; php-fpm clears the process environment by default, which would strip
; MOODLE_DB_*, REDIS_HOST, etc. from PHP's getenv() — Moodle's config.php
; reads these via loadenv() and would fall back to defaults. Preserve them.
clear_env = no

; Route PHP error_log() and stdout/stderr from worker processes to
; the container's stdout/stderr.
catch_workers_output  = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Status endpoint for php-fpm-exporter (not wired in by default — exposing
; it here so it's available when the sidecar is added).
pm.status_path = /fpm-status
ping.path      = /fpm-ping
