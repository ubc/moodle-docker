# Moodle Apache vhost — terminates HTTP and proxies .php to php-fpm via FastCGI.
# Apache runs the event MPM (one worker thread per request, idle keep-alive
# handled by the event reactor instead of a dedicated thread). PHP execution
# is offloaded to a separate php-fpm process pool, so a slow PHP request no
# longer pins an Apache worker for the full duration of the connection.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hand .php to php-fpm. The fpm pool listens on 127.0.0.1:9000 (see
    # /usr/local/etc/php-fpm.d/zz-moodle.conf).
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
        # pass Authorization header on so Moodle LTI services work
        CGIPassAuth On
    </FilesMatch>

    DirectoryIndex index.php index.html

    # Match Moodle's PHP_MAX_EXECUTION_TIME ceiling and the ingress
    # proxy-{read,send}-timeout window so long-running admin actions
    # (backup, restore, upgrade) don't get cut off by Apache.
    ProxyTimeout 300
    Timeout 300

    # Log to container stdout/stderr so kubectl logs and Loki/EFK pick it up.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Used by the apache-exporter sidecar (scrape_uri=http://status.localhost/server-status/?auto).
    # mod_status is enabled in the Dockerfile.
    <Location /server-status>
        SetHandler server-status
        Require local
    </Location>
</VirtualHost>
